[profile.default]
src = "contracts/evm/src"
test = "contracts/evm/test"
script = "contracts/evm/script"
out = "contracts/evm/out"
cache_path = "contracts/evm/cache"
libs = ["contracts/evm/lib"]
remappings = [
  "@openzeppelin/contracts/=contracts/evm/lib/openzeppelin-contracts/contracts/",
  "forge-std/=contracts/evm/lib/forge-std/src/",
]
solc_version = "0.8.38"
optimizer = true
optimizer_runs = 200
# The StreamDeposited and StreamAttested events carry 16 fields each; the legacy pipeline runs out of stack slots.
via_ir = true
evm_version = "cancun"

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"

[fmt]
line_length = 120

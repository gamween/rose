[workspace]
resolver = "2"
members = ["contracts/engine", "contracts/ibe", "contracts/mock-mpc", "contracts/tusdc"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/gamween/rose"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package]
name = "rose-mock-mpc"
version = "0.1.0"
description = "Mock of the NEAR MPC contract for the rose engine sandbox tests: signs with deterministic test keys"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.2", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
near-sdk = "5.30"
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
ark-ec = { version = "0.4", default-features = false }
near-sdk = { version = "5.30", features = ["unit-testing"] }
rose-ibe = { path = "../ibe" }

[package]
name = "rose-tusdc"
version = "0.1.0"
description = "Test USDC (NEP-141) for rose on NEAR testnet, with a public capped mint"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[package]
name = "rose-engine"
version = "0.1.0"
description = "rose engine: sealed uniform-price rounds for locked token allocations"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# `cargo near build reproducible-wasm` builds inside this image (cargo-near 0.22.0, the version of
# the non-reproducible builds, with Rust 1.97.0, the oldest toolchain sourcescan publishes for it),
# so anyone can rebuild the deployed wasm from a commit and compare its sha256. Tag and digest read
# from Docker Hub (`sourcescan/cargo-near`), see docs/verification.md.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.0"
image_digest = "sha256:b193c8640a27172f83136a0f0aab2a9bf9d09f6ba0e6afd187addfaa9b92bae0"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4.1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
near-sdk = { version = "5.30", features = ["unstable"] }
rose-ibe = { path = "../ibe", default-features = false, features = ["near"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
uint = { version = "0.10.2", default-features = false }

[dev-dependencies]
anyhow = "1"
base64 = "0.22"
ark-bls12-381 = { version = "0.4", default-features = false, features = ["curve"] }
ark-ec = { version = "0.4", default-features = false }
ark-ff = { version = "0.4", default-features = false }
ed25519-dalek = "2.2"
futures = "0.3"
k256 = { version = "0.13", features = ["ecdsa"] }
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
proptest = "1.12"
rand = "0.8"
serde_json = "1.0.140"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package]
name = "rose-engine"
version = "0.1.0"
description = "rose engine: sealed uniform-price rounds for locked token allocations"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4.1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
near-sdk = "5.30"
rose-ibe = { path = "../ibe", default-features = false, features = ["near"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
uint = { version = "0.10.2", default-features = false }

[dev-dependencies]
anyhow = "1"
ark-bls12-381 = { version = "0.4", default-features = false, features = ["curve"] }
ark-ec = { version = "0.4", default-features = false }
ark-ff = { version = "0.4", default-features = false }
futures = "0.3"
k256 = { version = "0.13", features = ["ecdsa"] }
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
proptest = "1.12"
rand = "0.8"
serde_json = "1.0.140"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
